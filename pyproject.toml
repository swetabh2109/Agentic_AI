[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai"
version = "0.1.0"
description = "A small Python 3.10 agent loop with pluggable tools."
requires-python = ">=3.10,<3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
